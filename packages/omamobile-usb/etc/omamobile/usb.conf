# Omamobile: the phone's USB port (omamobile-usb). Read again at the next
# plug, lock or unlock, and every 30 s: no restart needed.
#
# While the phone is locked there is no USB data: a computer sees nothing and
# the phone only charges. LOCKED=keep leaves USB as it is while locked
# (bring-up: SSH over USB stays up on a locked phone).
LOCKED=off
#
# What an unlocked phone gives a computer before anyone chooses for this
# connection: ask (a notification asks: SSH & network, file transfer or
# both), charge, network, files or both.
UNLOCKED=ask
#
# The USB power supply whose BC1.2 detection tells a computer (SDP, CDP) from
# a charger, when the first USB supply in /sys/class/power_supply isn't it.
#SUPPLY=
